[project]
name = "dvdrip"
version = "0.0.1"
description = "Rip DVDs quickly and easily from the command line."
readme = "README.md"
license-files = ["LICENSE"]
license = "AGPL-3.0-or-later"

authors = [
    { name = "Laurence Gonsalves" },
    { name = "Evan Downing" },
]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = ["pydantic-settings>=2.9,<3"]
requires-python = ">=3.13"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
doc = ["pdoc"]
test = ["pytest", "pytest-cov", "pytest-timeout", "pretend", "coverage[toml]"]
lint = [
    # NOTE: ruff is under active development, so we pin conservatively here
    # and let Dependabot periodically perform this update.
    "ruff ~= 0.14.0",
    "ty >=0.0.8",
    "interrogate",
]
dev = [
    {include-group = "doc"},
    {include-group = "test"},
    {include-group = "lint"},
    "prek",
]

[project.scripts]
"dvdrip" = "dvdrip._cli:main"

[project.urls]
Issues = "https://github.com/xenomachina/dvdrip/issues"
Source = "https://github.com/xenomachina/dvdrip"

[tool.coverage.run]
# don't attempt code coverage for the CLI entrypoints
omit = ["src/dvdrip/_cli.py"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "test"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",  # Incompatible with D211
    "D213",  # Incompatible with D212
    "COM812",  # Can conflict with formatter
    "ISC001",  # Can conflict with formatter
]

[tool.ruff.lint.mccabe]
# Maximum cyclomatic complexity
max-complexity = 8

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings
convention = "google"

[tool.ruff.lint.pylint]
# Maximum number of branches for function or method
max-branches = 12
# Maximum number of return statements in function or method
max-returns = 6
# Maximum number of positional arguments for function or method
max-positional-args = 5

[tool.ruff.lint.per-file-ignores]
"src/dvdrip/_cli.py" = [
    "TRY400", # user-facing errors should not include tracebacks
]
"test/**/*.py" = [
    "D",    # no docstrings in tests
    "S101", # asserts are expected in tests
    "PLR2004",  # Allow magic values in tests
]
"**/conftest.py" = ["D"]  # No docstrings in pytest config
[tool.interrogate]
# don't enforce documentation coverage for packaging, testing, the virtual
# environment, or the CLI (which is documented separately).
exclude = ["env", "test", "src/dvdrip/_cli.py"]
ignore-semiprivate = true
fail-under = 100

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "--durations=10"

[tool.uv.sources]
dvdrip = { workspace = true }
